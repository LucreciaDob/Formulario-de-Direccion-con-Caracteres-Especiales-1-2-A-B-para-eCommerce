<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Dirección</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2>Formulario de Dirección</h2>
    <form>
        <div class="form-group has-float-label">
            <input type="text" class="form-control" name="shippingAddress.number" inputmode="numeric" data-testid="shipping_number" autocomplete="shipping address-line2" maxlength="15" placeholder=" " autocapitalize="on" id="shippingAddress.number" aria-labelledby="label_shippingAddress.number">
            <label class="input-label" id="label_shippingAddress.number" for="shippingAddress.number">Número</label>
            <div class="input-button">
                <div class="form-group">
                    <label class="form-checkbox form-options-label" for="shipping_numbercheckbox">
                        <input validate="notEmpty" id="shipping_numbercheckbox" type="checkbox" name="shipping_numbercheckbox">
                        <div class="form-options-content">
                            <span class="form-group-icon">
                                <svg class="unchecked" width="17px" height="17px" viewBox="0 0 1024 1024">
                                    <path d="M914.3,0H109.7C49.1,0,0,49.1,0,109.7v804.6C0,974.9,49.1,1024,109.7,1024h804.6c60.6,0,109.7-49.1,109.7-109.7V109.7 C1024,49.1,974.9,0,914.3,0z M900.6,914.3H123.4c-7.5,0-13.7-6.2-13.7-13.7V123.4c0-7.5,6.2-13.7,13.7-13.7h777.1 c7.5,0,13.7,6.2,13.7,13.7v777.1C914.3,908.1,908.1,914.3,900.6,914.3z"></path>
                                </svg>
                                <svg class="checked" width="17px" height="17px" viewBox="0 0 1024 1024">
                                    <path d="M914.3,1024H109.7C49.1,1024,0,974.9,0,914.3V109.7C0,49.1,49.1,0,109.7,0h804.6C974.9,0,1024,49.1,1024,109.7v804.6 C1024,974.9,974.9,1024,914.3,1024z M446.4,799.9L867,379.3c14.3-14.3,14.3-37.4,0-51.7l-51.7-51.7c-14.3-14.3-37.4-14.3-51.7,0 l-343,343L260.4,458.7c-14.3-14.3-37.4-14.3-51.7,0L157,510.4c-14.3,14.3-14.3,37.4,0,51.7l237.7,237.7 C409,814.1,432.1,814.1,446.4,799.9L446.4,799.9z"></path>
                                </svg>
                            </span>
                            <span class="form-options-label">Sin número</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-checkbox form-options-label" for="extra_number_checkbox">
                <input id="extra_number_checkbox" type="checkbox">
                <span class="form-options-label">Mi número tiene más valores</span>
            </label>
        </div>
        
        <div class="form-group hidden" id="extraCampo">
            <label for="extraNumero">Valor adicional (Ej: 1/2):</label>
            <input type="text" id="extraNumero" name="extraNumero">
        </div>
        
        <button type="submit">Enviar</button>
    </form>

    <script>
        document.getElementById('shipping_numbercheckbox').addEventListener('click', function() {
            let numeroField = document.getElementById('shippingAddress.number');
            numeroField.value = "";
            numeroField.disabled = !numeroField.disabled;
        });

        document.getElementById('extra_number_checkbox').addEventListener('click', function() {
            let extraCampo = document.getElementById('extraCampo');
            extraCampo.classList.toggle('hidden');
        });
    </script>
</body>
</html>
